name: GHP regression tests

on:
  push:
    branches: [main]
    paths:
      - 'refrigerant-sizer/**'
      - '.github/workflows/ghp-regression.yml'
  pull_request:
    paths:
      - 'refrigerant-sizer/**'
      - '.github/workflows/ghp-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run GHP safety regression tests
        run: node --test refrigerant-sizer/tests/ghp-safety-regression.test.cjs
      - name: Run GHP size-up UI safety regression tests
        run: node --test refrigerant-sizer/tests/ghp-sizeup-ui-safety.test.cjs
      - name: Run Carrier engine regression tests
        run: node --test refrigerant-sizer/tests/carrier-engine-regression.test.cjs
      - name: Run GHP piping segment tests
        run: node --test refrigerant-sizer/tests/ghp-piping-segments.test.cjs
      - name: Run Panasonic UXE3 solenoid downstream regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-solenoid-downstream.test.cjs
      - name: Run Panasonic UI warning rendering tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/ui-warning-rendering.test.cjs
