name: GHP regression tests

on:
  push:
    branches: [main]
    paths:
      - 'refrigerant-sizer/**'
      - '.github/workflows/ghp-regression.yml'
  pull_request:
    paths:
      - 'refrigerant-sizer/**'
      - '.github/workflows/ghp-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run GHP safety regression tests
        run: node --test refrigerant-sizer/tests/ghp-safety-regression.test.cjs
      - name: Run GHP size-up UI safety regression tests
        run: node --test refrigerant-sizer/tests/ghp-sizeup-ui-safety.test.cjs
      - name: Run Carrier engine regression tests
        run: node --test refrigerant-sizer/tests/carrier-engine-regression.test.cjs
      - name: Run GHP piping segment tests
        run: node --test refrigerant-sizer/tests/ghp-piping-segments.test.cjs
      - name: Run Panasonic UXE3 solenoid downstream regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-solenoid-downstream.test.cjs
      - name: Run Panasonic UXE3 pipe path audit regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-path-audit.test.cjs
      - name: Run Panasonic UXE3 capacity basis regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-capacity-basis.test.cjs
      - name: Run Panasonic UXE3 equivalent length regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-equivalent-length.test.cjs
      - name: Run Panasonic UXE3 LM 50m split regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-lm-split.test.cjs
      - name: Run Panasonic UXE3 long pipe conditions regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-long-pipe-conditions.test.cjs
      - name: Run Panasonic UXE3 group nodes regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-group-nodes.test.cjs
      - name: Run Panasonic UXE3 UI display regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-ui-display.test.cjs
      - name: Run Panasonic UXE3 outdoor connection length regression tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/uxe3-outdoor-connection-length.test.cjs
      - name: Run Panasonic UI warning rendering tests
        run: node --test refrigerant-sizer/panasonic-refrigerant-sizer/tests/ui-warning-rendering.test.cjs
      - name: Run Aisin GHP verification corrections regression tests
        run: node --test refrigerant-sizer/tests/aisin-ghp-corrections.test.cjs
      - name: Run Yanmar GHP verification corrections regression tests
        run: node --test refrigerant-sizer/tests/yanmar-ghp-corrections.test.cjs
      - name: Run Mitsubishi verification corrections regression tests
        run: node --test refrigerant-sizer/tests/mitsubishi-verification-corrections.test.cjs
      - name: Run Daikin VRV verification corrections regression tests
        run: node --test refrigerant-sizer/daikin-refrigerant-sizer/tests/daikin-vrv-corrections.test.cjs
      - name: Run Panasonic GHP verification corrections regression tests
        run: node --test refrigerant-sizer/tests/panasonic-ghp-corrections.test.cjs
